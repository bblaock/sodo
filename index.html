<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a08"><title>SODO — Choose language</title><style>:root{--bg:#080a08;--surface:#111510;--line:#293126;--text:#f4f7ef;--muted:#b0b9a9;--accent:#c8ff4d}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Manrope,Arial,sans-serif;display:grid;place-items:center;padding:28px}main{width:min(680px,100%);text-align:center}.logo{font-size:clamp(52px,12vw,86px);font-weight:900;letter-spacing:8px;color:var(--accent)}p{color:var(--muted);margin:12px 0 38px;letter-spacing:2px;font-size:13px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}a{display:block;padding:22px 12px;border:1px solid var(--line);background:var(--surface);color:var(--text);text-decoration:none;font-size:18px;transition:.2s}a:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-3px)}@media(max-width:480px){nav{grid-template-columns:1fr}}</style></head><body><main><div class="logo">SODO.</div><p>THINK. FEEL. CREATE.</p><nav aria-label="Choose language"><a href="/sodo/ar/">العربية</a><a href="/sodo/en/">English</a><a href="/sodo/ru/">Русский</a></nav></main></body></html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a08">
  <meta name="description" content="SODO — Choose your language">
  <title>SODO — Language</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a08;
      --panel: #111510;
      --panel-highlight: #171d14;
      --line: rgba(200, 255, 77, .18);
      --text: #f4f7ef;
      --muted: #9ca895;
      --accent: #c8ff4d;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      min-height: 100svh;
      margin: 0;
      padding: 20px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(151, 190, 67, .10), transparent 48%),
        var(--bg);
      color: var(--text);
      font-family: Manrope, Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .language-panel {
      width: min(100%, 356px);
      padding: 32px 24px 24px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(155deg, rgba(25, 31, 21, .98), rgba(13, 16, 12, .98));
      box-shadow: 0 24px 80px rgba(0, 0, 0, .48), inset 0 1px rgba(255,255,255,.035);
      animation: panel-in .55s cubic-bezier(.2,.75,.25,1) both;
    }
    .brand {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 2px;
      margin: 0;
      color: var(--text);
      font-size: 48px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .13em;
    }
    .brand-dot { color: var(--accent); }
    .tagline {
      margin: 11px 0 27px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .34em;
    }
    .prompt {
      margin: 0 0 15px;
      color: #dce4d4;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
    }
    .language-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
    }
    .language-option {
      min-width: 0;
      min-height: 91px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid rgba(255,255,255,.085);
      border-radius: 14px;
      background: rgba(255,255,255,.025);
      color: var(--text);
      text-decoration: none;
      transition: border-color .2s ease, background .2s ease, transform .2s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .language-option:hover, .language-option:focus-visible {
      outline: none;
      border-color: rgba(200,255,77,.65);
      background: rgba(200,255,77,.075);
      box-shadow: 0 0 0 3px rgba(200,255,77,.07);
      transform: translateY(-2px);
    }
    .flag {
      width: 34px;
      height: 34px;
      display: block;
      flex: 0 0 34px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.2);
      box-shadow: 0 2px 9px rgba(0,0,0,.32);
    }
    .flag svg { display: block; width: 100%; height: 100%; }
    .code {
      color: #eaf0e4;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
    }
    .footer {
      margin: 20px 0 0;
      color: #697363;
      font-size: 9px;
      letter-spacing: .12em;
    }
    @keyframes panel-in {
      from { opacity: 0; transform: translateY(10px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (max-width: 360px) {
      .language-panel { padding: 27px 17px 20px; }
      .language-list { gap: 7px; }
      .language-option { min-height: 84px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="language-panel" aria-labelledby="sodo-brand">
    <h1 class="brand" id="sodo-brand">SODO<span class="brand-dot">.</span></h1>
    <p class="tagline">THINK. FEEL. CREATE.</p>
    <p class="prompt">CHOOSE LANGUAGE</p>
    <nav class="language-list" aria-label="Choose your language">
      <a class="language-option" href="/sodo/ar/" lang="ar" hreflang="ar" aria-label="العربية">
        <span class="flag" aria-hidden="true">
          <svg viewBox="0 0 40 40" role="img">
            <defs><clipPath id="iraq-circle"><circle cx="20" cy="20" r="20"/></clipPath></defs>
            <g clip-path="url(#iraq-circle)">
              <rect width="40" height="40" fill="#fff"/>
              <path fill="#ce1126" d="M0 0h40v13.34H0z"/>
              <path fill="#000" d="M0 26.66h40V40H0z"/>
              <text x="20" y="23.1" fill="#078930" font-size="6.2" font-weight="700" text-anchor="middle">الله أكبر</text>
            </g>
          </svg>
        </span>
        <span class="code">AR</span>
      </a>
      <a class="language-option" href="/sodo/en/" lang="en" hreflang="en" aria-label="English">
        <span class="flag" aria-hidden="true">
          <svg viewBox="0 0 40 40" role="img">
            <defs><clipPath id="uk-circle"><circle cx="20" cy="20" r="20"/></clipPath></defs>
            <g clip-path="url(#uk-circle)">
              <rect width="40" height="40" fill="#012169"/>
              <path d="M0 0L40 40M40 0L0 40" stroke="#fff" stroke-width="8"/>
              <path d="M0 0L40 40M40 0L0 40" stroke="#c8102e" stroke-width="3.5"/>
              <path d="M20 0V40M0 20H40" stroke="#fff" stroke-width="13"/>
              <path d="M20 0V40M0 20H40" stroke="#c8102e" stroke-width="7"/>
            </g>
          </svg>
        </span>
        <span class="code">EN</span>
      </a>
      <a class="language-option" href="/sodo/ru/" lang="ru" hreflang="ru" aria-label="Русский">
        <span class="flag" aria-hidden="true">
          <svg viewBox="0 0 40 40" role="img">
            <defs><clipPath id="russia-circle"><circle cx="20" cy="20" r="20"/></clipPath></defs>
            <g clip-path="url(#russia-circle)">
              <rect width="40" height="40" fill="#fff"/>
              <path fill="#0039a6" d="M0 13.34h40v13.33H0z"/>
              <path fill="#d52b1e" d="M0 26.67h40V40H0z"/>
            </g>
          </svg>
        </span>
        <span class="code">RU</span>
      </a>
    </nav>
    <p class="footer">SODO · PERSONAL SPACE</p>
  </main>
</body>
</html>

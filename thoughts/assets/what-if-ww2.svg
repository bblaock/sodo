 <text x="70" y="108" font-size="34" font-weight="700">1939</text>
 <text x="1130" y="620" font-size="16" letter-spacing="3" text-anchor="end" opacity=".65">ONE QUESTION · MANY POSSIBLE FUTURES</text>
</g>
</svg>
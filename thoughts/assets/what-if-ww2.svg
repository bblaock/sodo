<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Two paths through the twentieth century</title>
<desc id="desc">An editorial illustration of a historical crossroads: one route leads through the destruction of war, while another passes through diplomacy and an industrial city. Neither route promises a perfect future.</desc>
<defs>
 <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18252a"/><stop offset="1" stop-color="#080d10"/></linearGradient>
 <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0dfbd"/><stop offset="1" stop-color="#b99b70"/></linearGradient>
 <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9c6a2"/><stop offset="1" stop-color="#8f8067"/></linearGradient>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#dce6db" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="675" fill="url(#night)"/><rect width="1200" height="675" fill="url(#grid)"/>
<circle cx="600" cy="210" r="172" fill="#e5d2ac" opacity=".08"/><circle cx="600" cy="210" r="150" fill="none" stroke="#c8ff4d" stroke-opacity=".5" stroke-width="2"/>

<path d="M515 95l34-15 26 12 16-10 28 18 25-5 18 22-9 21 19 17-13 21-28 4-12 23-25 7-8 27-22-3-10-22-23-8-5-24-22-12 7-22-19-20 10-31z" fill="#e7d8b8" stroke="#a7b79e" stroke-width="3"/>
<path d="M475 195q125 42 250 0M490 235q110 34 220 0" fill="none" stroke="#8fa19a" stroke-opacity=".45" stroke-width="2"/>
<circle cx="600" cy="330" r="13" fill="#c8ff4d"/><circle cx="600" cy="330" r="26" fill="none" stroke="#c8ff4d" stroke-opacity=".45" stroke-width="2"/>
<!-- branching paths -->
<path d="M600 345C590 410 480 435 330 490S130 590 75 675" fill="none" stroke="#c8ff4d" stroke-width="5" opacity=".9"/>
<path d="M600 345C610 410 720 435 870 490s200 100 255 185" fill="none" stroke="#c8ff4d" stroke-width="5" opacity=".9"/>
<path d="M600 345C590 410 480 435 330 490S130 590 75 675" fill="none" stroke="url(#road)" stroke-width="78"/>
<path d="M600 345C610 410 720 435 870 490s200 100 255 185" fill="none" stroke="url(#road)" stroke-width="78"/>
<path d="M600 365C592 420 480 455 330 510S150 600 100 675M600 365C608 420 720 455 870 510s180 90 230 165" fill="none" stroke="#f6e8cb" stroke-opacity=".65" stroke-width="2" stroke-dasharray="13 17"/>

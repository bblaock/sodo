<g fill="#6f7770">
 <path d="M0 440h85v-104l22-28 20 28v104h40v-75l28-20 25 20v75h45v-132l30-25 27 25v132h50v-82l23-18 25 18v82h-25v-20H0z"/>
 <path d="M15 420v-48h17v48m28 0v-58h16v58m91 0v-35h18v35m91 0v-69h18v69m46 0v-42h18v42" fill="#26343a"/>
 <path d="M0 340l46-28 29 14 35-46 30 28 30-12 35 37 35-27 30 29 37-14 30 19" fill="none" stroke="#a68e6d" stroke-width="9" opacity=".8"/>
</g>
<g fill="none" stroke="#a68e6d" stroke-width="9" stroke-linecap="round" opacity=".7"><path d="M55 280q-35-28 0-54t-2-55M105 250q-26-23 0-47t-3-46M235 270q-30-25 0-52t-2-45"/></g>
<path d="M58 470l38-32 28 30 28-20 30 29 31-23 26 24" fill="none" stroke="#c8ff4d" stroke-opacity=".4" stroke-width="3"/>

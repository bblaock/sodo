name: SODO Language Browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodo-language-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Locale routing and translation browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run static repository QA
        run: python tools/sodo_qa.py
      - name: Run browser tests against local GitHub Pages path
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sodo-language-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  live:
    name: Live GitHub Pages language smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          url="https://bblaock.github.io/sodo/en/"
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error "$url" -o /tmp/sodo-en.html 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "GitHub Pages did not become reachable within six minutes."
              exit 1
            fi
            sleep 10
          done
      - name: Test published language switching
        env:
          BASE_URL: https://bblaock.github.io
        run: npm run test:e2e

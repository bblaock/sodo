name: SODO Python QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site-checks:
    name: Static site checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile QA script
        run: python -m py_compile tools/sodo_qa.py

      - name: Run SODO QA
        run: python tools/sodo_qa.py

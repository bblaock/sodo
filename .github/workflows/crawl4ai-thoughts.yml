name: Crawl4AI Thoughts audit

on:
  pull_request:
    paths:
      - "thoughts/**"
      - "ar/thoughts/**"
      - "en/thoughts/**"
      - "ru/thoughts/**"
      - "tests/crawl4ai_thoughts_audit.py"
      - "requirements-crawl4ai.txt"
      - ".github/workflows/crawl4ai-thoughts.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: crawl4ai-thoughts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crawl-thoughts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-crawl4ai.txt

      - name: Install Crawl4AI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-crawl4ai.txt
          crawl4ai-setup

      - name: Crawl live Thoughts pages
        run: python tests/crawl4ai_thoughts_audit.py

      - name: Upload crawl report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl4ai-thoughts-report
          path: crawl4ai-report.json
          if-no-files-found: ignore
          retention-days: 14
